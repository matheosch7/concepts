<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GemiVexa styleframe</title>
<script src="lib/gsap.min.js"></script>
<script src="lib/CustomEase.min.js"></script>
<script src="lib/SplitText.min.js"></script>
<script src="lib/DrawSVGPlugin.min.js"></script>
<link rel="stylesheet" href="typefx/fx.css" />
<style>
@font-face{font-family:'Pop';src:url('fonts/poppins-500.woff2') format('woff2');font-weight:500;}
@font-face{font-family:'Pop';src:url('fonts/poppins-700.woff2') format('woff2');font-weight:700;}
@font-face{font-family:'Pop';src:url('fonts/poppins-800.woff2') format('woff2');font-weight:800;}
*{margin:0;padding:0;box-sizing:border-box;}
:root{--cob:#2340FF;--lime:#D7FF3A;--ink:#0E0E12;--paper:#F2F0EA;--coral:#FF5A36;}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--cob);font-family:'Pop',sans-serif;}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--cob);}
.act{position:absolute;inset:0;overflow:hidden;}
#a1{background:var(--cob);color:var(--paper);}
#a2{background:var(--lime);color:var(--ink);clip-path:polygon(110% 0,130% 0,130% 100%,120% 100%);}
#a3{background:var(--ink);color:var(--paper);clip-path:circle(0px at 1340px 560px);}
#a4{background:var(--paper);color:var(--ink);clip-path:inset(0 0 100% 0);}
.kick{position:absolute;left:150px;top:300px;font-weight:700;font-size:26px;letter-spacing:.32em;}
.word{position:absolute;left:140px;top:340px;font-weight:800;font-size:250px;letter-spacing:-.045em;line-height:1.05;}
.word.sm{font-size:210px;}
.bar{position:absolute;left:150px;top:650px;height:16px;width:420px;transform-origin:0 50%;}
/* browser mockup */
#browser{position:absolute;left:1000px;top:210px;width:780px;height:560px;border-radius:26px;background:var(--paper);
  box-shadow:0 40px 0 -10px rgba(14,14,18,.25);overflow:hidden;}
#browser .top{height:52px;background:#E3E0D7;display:flex;align-items:center;gap:10px;padding-left:22px;}
#browser .top i{width:14px;height:14px;border-radius:50%;background:#C9C5BA;display:block;}
.blk{position:absolute;border-radius:12px;}
#nav{left:32px;top:78px;width:716px;height:34px;background:#E3E0D7;}
#heroB{left:32px;top:136px;width:400px;height:170px;background:var(--ink);}
#heroT1{left:58px;top:168px;width:300px;height:26px;background:var(--lime);border-radius:6px;}
#heroT2{left:58px;top:208px;width:220px;height:26px;background:var(--paper);border-radius:6px;opacity:.85;}
#img{left:452px;top:136px;width:296px;height:258px;background:var(--coral);}
#btn{left:58px;top:250px;width:150px;height:36px;background:var(--cob);border-radius:18px;}
.card{top:414px;width:224px;height:112px;background:#E3E0D7;}
#c1{left:32px}#c2{left:278px}#c3{left:524px}
#cursor{position:absolute;left:1500px;top:760px;width:40px;height:40px;}
/* automate */
#flow{position:absolute;left:0;top:0;width:1920px;height:1080px;}
.node{position:absolute;width:190px;height:190px;border-radius:40px;background:var(--ink);display:flex;align-items:center;justify-content:center;}
.node svg{width:92px;height:92px;}
#n1{left:1000px;top:700px}#n2{left:1300px;top:700px;background:var(--cob);}#n3{left:1600px;top:700px}
.tag{position:absolute;top:915px;width:190px;text-align:center;font-weight:700;font-size:24px;letter-spacing:.14em;}
.pkt{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--cob);top:782px;left:1190px;opacity:0;}
/* grow */
#phone{position:absolute;left:1150px;top:130px;width:420px;height:820px;border-radius:64px;background:#1D1D24;border:14px solid #2A2A33;overflow:hidden;}
#phone .notch{position:absolute;left:50%;top:18px;width:120px;height:30px;border-radius:15px;background:#0E0E12;transform:translateX(-50%);}
#phone .lbl{position:absolute;left:36px;top:92px;font-weight:700;font-size:22px;letter-spacing:.18em;color:#8B8B99;}
#phone .big{position:absolute;left:34px;top:126px;font-weight:800;font-size:62px;color:var(--paper);letter-spacing:-.03em;}
.gbar{position:absolute;bottom:130px;width:62px;border-radius:14px 14px 4px 4px;background:#3A3A46;transform-origin:50% 100%;}
#g1{left:36px;height:130px}#g2{left:114px;height:210px}#g3{left:192px;height:320px}#g4{left:270px;height:470px;background:var(--coral);}
#arrow{position:absolute;left:0;top:0;width:392px;height:792px;}
/* end card */
#mark{position:absolute;left:50%;top:290px;display:flex;gap:18px;align-items:flex-end;}
#mark i{display:block;width:44px;border-radius:12px;transform-origin:50% 100%;}
#m1{height:70px;background:var(--cob)}#m2{height:110px;background:var(--lime);border:3px solid var(--ink)}#m3{height:150px;background:var(--coral)}
#logo{position:absolute;left:0;right:0;top:470px;text-align:center;font-weight:800;font-size:170px;letter-spacing:-.05em;line-height:1.1;}
#tagline{position:absolute;left:0;right:0;top:680px;text-align:center;font-weight:700;font-size:44px;letter-spacing:.02em;}
#tagline span{display:inline-block;margin:0 10px;}
#cta{position:absolute;left:50%;top:790px;padding:22px 46px;border-radius:60px;background:var(--cob);color:var(--paper);font-weight:700;font-size:32px;white-space:nowrap;}
#wm{position:absolute;right:34px;bottom:26px;font-family:'Geist',sans-serif;font-weight:400;font-size:18px;color:rgba(14,14,18,.55);mix-blend-mode:difference;color:rgba(255,255,255,.55);z-index:9;}
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">

  <section class="act" id="a1">
    <div class="kick" id="k1">01 — WEBSITES &amp; APPS</div>
    <div class="word" id="w1">Build.</div>
    <div class="bar" id="b1" style="background:var(--lime)"></div>
    <div id="browser">
      <div class="top"><i></i><i></i><i></i></div>
      <div class="blk" id="nav"></div>
      <div class="blk" id="heroB"></div>
      <div class="blk" id="heroT1"></div>
      <div class="blk" id="heroT2"></div>
      <div class="blk" id="btn"></div>
      <div class="blk" id="img"></div>
      <div class="blk card" id="c1"></div><div class="blk card" id="c2"></div><div class="blk card" id="c3"></div>
    </div>
    <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2l7 19 2.6-7.4L20 11z" fill="#0E0E12" stroke="#F2F0EA" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </section>

  <section class="act" id="a2">
    <div class="kick" id="k2">02 — AI AGENTS</div>
    <div class="word sm" id="w2">Automate.</div>
    <div class="bar" id="b2" style="background:var(--cob)"></div>
    <svg id="flow" viewBox="0 0 1920 1080">
      <path id="l1" d="M1190 795 L1300 795" stroke="#0E0E12" stroke-width="10" stroke-linecap="round"/>
      <path id="l2" d="M1490 795 L1600 795" stroke="#0E0E12" stroke-width="10" stroke-linecap="round"/>
    </svg>
    <div class="node" id="n1"><svg viewBox="0 0 24 24" fill="none" stroke="#F2F0EA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
    <div class="node" id="n2"><svg viewBox="0 0 24 24" fill="none" stroke="#D7FF3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17l.7 1.8 1.8.7-1.8.7L19 22l-.7-1.8-1.8-.7 1.8-.7z"/></svg></div>
    <div class="node" id="n3"><svg viewBox="0 0 24 24" fill="none" stroke="#F2F0EA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="chk" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="tag" id="t1" style="left:1000px">LEAD IN</div>
    <div class="tag" id="t2" style="left:1300px">AI AGENT</div>
    <div class="tag" id="t3" style="left:1600px">BOOKED</div>
    <div class="pkt" id="p1"></div><div class="pkt" id="p2" style="left:1490px"></div>
  </section>

  <section class="act" id="a3">
    <div class="kick" id="k3">03 — AI MARKETING</div>
    <div class="word" id="w3">Grow.</div>
    <div class="bar" id="b3" style="background:var(--coral)"></div>
    <div id="phone">
      <div class="notch"></div>
      <div class="lbl">THIS MONTH</div>
      <div class="big" id="big">Leads&nbsp;↑</div>
      <div class="gbar" id="g1"></div><div class="gbar" id="g2"></div><div class="gbar" id="g3"></div><div class="gbar" id="g4"></div>
      <svg id="arrow" viewBox="0 0 392 792"><path id="ar" d="M40 600 C120 560 170 520 220 420 S300 260 330 200" fill="none" stroke="#D7FF3A" stroke-width="9" stroke-linecap="round"/><path id="arh" d="M300 196 L334 192 L328 228" fill="none" stroke="#D7FF3A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </section>

  <section class="act" id="a4">
    <div id="mark"><i id="m1"></i><i id="m2"></i><i id="m3"></i></div>
    <div id="logo">GemiVexa</div>
    <div id="tagline"><span>Build.</span><span>Automate.</span><span>Grow.</span></div>
    <div id="cta">Start your project →</div>
  </section>

  <div id="wm">Style frame by Matt — for GemiVexa · logo &amp; colours are stand-ins</div>
</div>

<script src="typefx/typefx.js"></script>
<script>
window.__timelines = window.__timelines || {};
const B = 0.5;                      // 120 BPM, 16 beats = 8.0 s
const snap = "back.out(2.2)", out = "expo.out";
const tl = gsap.timeline({ paused:true });
gsap.set(["#cta","#mark"], { xPercent:-50 });

// ACT 1 — BUILD (beats 0-4)
TypeFX.charCascade(tl, "#w1", { at:0.0, stagger:0.035, dur:0.4, ease:out });
TypeFX.charCascade(tl, "#k1", { at:0.1, stagger:0.012, dur:0.3 });
tl.from("#b1", { scaleX:0, duration:0.4, ease:out }, B*1);
tl.from("#browser", { y:120, scale:0.86, rotate:-4, opacity:0, duration:0.55, ease:snap }, 0.0);
tl.from("#nav", { scaleX:0, transformOrigin:"0 50%", duration:0.3, ease:out }, B*1);
tl.from("#heroB", { scaleY:0, transformOrigin:"50% 0", duration:0.3, ease:out }, B*1.5);
tl.from(["#heroT1","#heroT2"], { scaleX:0, transformOrigin:"0 50%", duration:0.25, ease:out, stagger:0.08 }, B*2);
tl.from("#img", { scale:0, duration:0.35, ease:snap }, B*2);
tl.from(".card", { y:60, opacity:0, duration:0.3, ease:snap, stagger:0.09 }, B*2.5);
tl.from("#btn", { scale:0, duration:0.3, ease:snap }, B*3);
tl.fromTo("#cursor", { x:260, y:260, opacity:0 }, { x:-370, y:-285, opacity:1, duration:0.45, ease:"power3.out" }, B*3);
tl.to("#btn", { scale:0.86, duration:0.08, yoyo:true, repeat:1 }, B*3.9);
tl.to("#browser", { x:-40, duration:0.3, ease:"power2.in" }, B*4.4);

// WIPE 1 — lime diagonal sweep (beat 5)
tl.fromTo("#a2", { clipPath:"polygon(110% 0,130% 0,130% 100%,120% 100%)" },
  { clipPath:"polygon(-30% 0,130% 0,130% 100%,-10% 100%)", duration:0.36, ease:"power3.inOut" }, B*4.6);

// ACT 2 — AUTOMATE (beats 5-9)
TypeFX.charCascade(tl, "#w2", { at:B*5, stagger:0.025, dur:0.35, ease:out });
TypeFX.charCascade(tl, "#k2", { at:B*5, stagger:0.012, dur:0.3 });
tl.from("#b2", { scaleX:0, duration:0.4, ease:out }, B*5.5);
["#n1","#n2","#n3"].forEach((n,i)=> tl.from(n, { scale:0, rotate:-20, duration:0.35, ease:snap }, B*(5.5+i)));
["#t1","#t2","#t3"].forEach((t,i)=> tl.from(t, { y:30, opacity:0, duration:0.25, ease:out }, B*(5.7+i)));
tl.from("#l1", { drawSVG:"0%", duration:0.25, ease:out }, B*6.2);
tl.from("#l2", { drawSVG:"0%", duration:0.25, ease:out }, B*7.2);
tl.fromTo("#p1", { opacity:1, x:0 }, { opacity:1, x:84, duration:0.3, ease:"power2.inOut", immediateRender:false }, B*6.4);
tl.to("#p1", { opacity:0, duration:0.05 }, B*6.4+0.3);
tl.fromTo("#p2", { opacity:1, x:0 }, { opacity:1, x:84, duration:0.3, ease:"power2.inOut", immediateRender:false }, B*7.4);
tl.to("#p2", { opacity:0, duration:0.05 }, B*7.4+0.3);
tl.from("#chk", { drawSVG:"0%", duration:0.25, ease:out }, B*8);
tl.to("#n3", { scale:1.12, background:"#2340FF", duration:0.12, yoyo:true, repeat:1 }, B*8.3);

// WIPE 2 — ink iris out of the check (beat 9)
tl.fromTo("#a3", { clipPath:"circle(0px at 1695px 795px)" }, { clipPath:"circle(2300px at 1695px 795px)", duration:0.4, ease:"power3.in" }, B*8.5);

// ACT 3 — GROW (beats 9-12)
TypeFX.charCascade(tl, "#w3", { at:B*9, stagger:0.04, dur:0.4, ease:out });
TypeFX.charCascade(tl, "#k3", { at:B*9, stagger:0.012, dur:0.3 });
tl.from("#b3", { scaleX:0, duration:0.4, ease:out }, B*9.5);
tl.from("#phone", { y:500, rotate:8, duration:0.5, ease:snap }, B*8.9);
["#g1","#g2","#g3","#g4"].forEach((g,i)=> tl.from(g, { scaleY:0, duration:0.3, ease:snap }, B*(9.5+i*0.5)));
tl.from("#ar", { drawSVG:"0%", duration:0.55, ease:"power2.inOut" }, B*10.5);
tl.from("#arh", { drawSVG:"0%", duration:0.15, ease:out }, B*10.5+0.5);
tl.from("#big", { y:40, opacity:0, duration:0.3, ease:out }, B*9.5);
tl.to("#phone", { scale:1.06, duration:0.9, ease:"sine.inOut" }, B*10.5);

// WIPE 3 — paper panel drops down (beat 12.5)
tl.fromTo("#a4", { clipPath:"inset(0% 0% 100% 0%)" }, { clipPath:"inset(0% 0% 0% 0%)", duration:0.32, ease:"power3.inOut" }, B*12);

// END CARD — mark, logo, tagline, CTA (beats 12.5-16)
["#m1","#m2","#m3"].forEach((m,i)=> tl.from(m, { scaleY:0, duration:0.3, ease:snap }, B*12.6 + i*0.09));
TypeFX.charCascade(tl, "#logo", { at:B*13, stagger:0.03, dur:0.4, ease:out });
tl.from("#tagline span", { y:40, opacity:0, duration:0.25, ease:out, stagger:B*0.5 }, B*14);
tl.from("#cta", { scale:0.3, opacity:0, duration:0.4, ease:snap }, B*15);
tl.to("#logo", { scale:1.02, duration:1.2, ease:"sine.out" }, B*13.6);

window.__timelines["main"] = tl;
</script>
</body>
</html>
